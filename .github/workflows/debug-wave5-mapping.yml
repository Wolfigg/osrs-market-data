name: Apply Wave 5 mapping hotfix

on:
  push:
    branches:
      - hotfix/wave5-live-refresh

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[wave5-hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/wave5-live-refresh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch catalogue mappings and disabled untradeable method
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_path = Path("src/osrs_market/catalog_wave5.py")
          text = catalog_path.read_text(encoding="utf-8")

          replacements = {
              '"Forinthry bracelet(5)"': '"Abyssal bracelet(5)"',
              'raw = f"{gem.title()} {piece}"': 'raw = "Dragon necklace" if gem == "dragonstone" and piece == "necklace" else f"{gem.title()} {piece}"',
              '("varrock", "Varrock teleport",': '("varrock", "Varrock teleport (tablet)",',
              '("lumbridge", "Lumbridge teleport",': '("lumbridge", "Lumbridge teleport (tablet)",',
              '("falador", "Falador teleport",': '("falador", "Falador teleport (tablet)",',
              '("house", "Teleport to house",': '("house", "Teleport to house (tablet)",',
              '("camelot", "Camelot teleport",': '("camelot", "Camelot teleport (tablet)",',
              '("kourend_castle", "Kourend castle teleport",': '("kourend_castle", "Kourend castle teleport (tablet)",',
              '("ardougne", "Ardougne teleport",': '("ardougne", "Ardougne teleport (tablet)",',
              '("watchtower", "Watchtower teleport",': '("watchtower", "Watchtower teleport (tablet)",',
              '("paddewwa", "Paddewwa teleport",': '("paddewwa", "Paddewwa teleport (tablet)",',
              '("senntisten", "Senntisten teleport",': '("senntisten", "Senntisten teleport (tablet)",',
              '("kharyrll", "Kharyrll teleport",': '("kharyrll", "Kharyrll teleport (tablet)",',
              '("lassar", "Lassar teleport",': '("lassar", "Lassar teleport (tablet)",',
              '("dareeyak", "Dareeyak teleport",': '("dareeyak", "Dareeyak teleport (tablet)",',
              '("carrallanger", "Carrallanger teleport",': '("carrallanger", "Carrallanger teleport (tablet)",',
              '("annakarl", "Annakarl teleport",': '("annakarl", "Annakarl teleport (tablet)",',
              '("ghorrock", "Ghorrock teleport",': '("ghorrock", "Ghorrock teleport (tablet)",',
              '("moonclan", "Moonclan teleport",': '("moonclan", "Moonclan teleport (tablet)",',
              '("ourania", "Ourania teleport",': '("ourania", "Ourania teleport (tablet)",',
              '("waterbirth", "Waterbirth teleport",': '("waterbirth", "Waterbirth teleport (tablet)",',
              '("barbarian", "Barbarian teleport",': '("barbarian", "Barbarian teleport (tablet)",',
              '("khazard", "Khazard teleport",': '("khazard", "Khazard teleport (tablet)",',
              '("fishing_guild", "Fishing guild teleport",': '("fishing_guild", "Fishing guild teleport (tablet)",',
              '("catherby", "Catherby teleport",': '("catherby", "Catherby teleport (tablet)",',
              '("ice_plateau", "Ice plateau teleport",': '("ice_plateau", "Ice plateau teleport (tablet)",',
              '("arceuus_library", "Arceuus library teleport",': '("arceuus_library", "Arceuus library teleport (tablet)",',
              '("draynor_manor", "Draynor manor teleport",': '("draynor_manor", "Draynor manor teleport (tablet)",',
              '("battlefront", "Battlefront teleport",': '("battlefront", "Battlefront teleport (tablet)",',
              '("mind_altar", "Mind altar teleport",': '("mind_altar", "Mind altar teleport (tablet)",',
              '("salve_graveyard", "Salve graveyard teleport",': '("salve_graveyard", "Salve graveyard teleport (tablet)",',
              '("fenkenstrain", "Fenkenstrain\'s castle teleport",': '("fenkenstrain", "Fenkenstrain\'s castle teleport (tablet)",',
              '("west_ardougne", "West ardougne teleport",': '("west_ardougne", "West ardougne teleport (tablet)",',
              '("harmony_island", "Harmony island teleport",': '("harmony_island", "Harmony island teleport (tablet)",',
              '("cemetery", "Cemetery teleport",': '("cemetery", "Cemetery teleport (tablet)",',
              '("barrows", "Barrows teleport",': '("barrows", "Barrows teleport (tablet)",',
              '("ape_atoll", "Ape atoll teleport",': '("ape_atoll", "Ape atoll teleport (tablet)",',
              '(("crushed_nests", "Bird nest", "Crushed nest")': '(("crushed_nests", "Bird nest (empty)", "Crushed nest")',
              '("goat_horn_dust", "Desert goat horn", "Goat horn dust")': '("goat_horn_dust", "Goat horn", "Goat horn dust")',
              '[out(log_name, 1, quantity_expected=255 / 256, quantity_minimum=255 / 256), out("Bird nest", 1, quantity_expected=1 / 256, quantity_minimum=0)]': '[out(log_name)]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected catalogue source not found: {old}")
              text = text.replace(old, new)

          marker = '    orb_specs = {'
          insertion = '''    # Digsite pendants are untradeable in OSRS, so this conversion cannot be\n    # valued by the GE profit engine. Keep the catalogue definition for family\n    # coverage but disable it until untradeable-output economics are supported.\n    methods["enchant_ruby_necklace"]["enabled"] = False\n    methods["enchant_ruby_necklace"]["notes"] += " Output is an untradeable Digsite pendant and is intentionally excluded from GE profit ranking."\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit("orb catalogue marker not found")
              text = text.replace(marker, insertion + marker, 1)
          catalog_path.write_text(text, encoding="utf-8")

          cli_path = Path("src/osrs_market/cli.py")
          cli = cli_path.read_text(encoding="utf-8")
          old_loop = '    for method_id, method in methods_config.get("methods", {}).items():\n        for _, variant in iter_method_variants(str(method_id), method):'
          new_loop = '    for method_id, method in methods_config.get("methods", {}).items():\n        if method.get("enabled", True) is False:\n            continue\n        for _, variant in iter_method_variants(str(method_id), method):'
          if old_loop not in cli:
              raise SystemExit("catalogue resolver loop not found")
          cli = cli.replace(old_loop, new_loop, 1)
          cli_path.write_text(cli, encoding="utf-8")

          tests_path = Path("tests/test_catalog_wave5.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_test = '''def test_gathering_only_values_defensible_nest_roll():\n    method = wave5_method_catalog()["gather_yew_logs"]\n    assert method["outputs"][0]["quantity_expected"] == 255 / 256\n    assert method["outputs"][1]["quantity_expected"] == 1 / 256\n    assert "Clue nest contents" in method["model"]["excludedExpectedOutputs"]\n'''
          new_test = '''def test_gathering_does_not_assign_market_value_to_unsearched_bird_nests():\n    method = wave5_method_catalog()["gather_yew_logs"]\n    assert method["outputs"] == [{"item_name": "Yew logs", "quantity": 1}]\n    assert "Clue nest contents" in method["model"]["excludedExpectedOutputs"]\n\n\ndef test_untradeable_digsite_pendant_conversion_is_not_ranked():\n    method = wave5_method_catalog()["enchant_ruby_necklace"]\n    assert method["enabled"] is False\n    assert "untradeable Digsite pendant" in method["notes"]\n'''
          if old_test not in tests:
              raise SystemExit("Wave 5 gathering test block not found")
          tests = tests.replace(old_test, new_test, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run regression suite
        run: pytest -q
      - name: Prove live catalogue resolves against current Wiki mapping
        env:
          OSRS_MARKET_USER_AGENT: "osrs-market-data/0.3 wave5-hotfix - github.com/${{ github.repository }}"
        run: python -m osrs_market.cli collect --mode live --output build --cache-dir .market-cache
      - name: Commit verified hotfix and remove temporary workflow
        run: |
          rm .github/workflows/debug-wave5-mapping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/osrs_market/catalog_wave5.py src/osrs_market/cli.py tests/test_catalog_wave5.py .github/workflows/debug-wave5-mapping.yml
          git commit -m "Fix Wave 5 live item mappings [wave5-hotfix-applied]"
          git push origin HEAD:hotfix/wave5-live-refresh
