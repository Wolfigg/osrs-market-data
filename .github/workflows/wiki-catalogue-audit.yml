name: Wiki catalogue discovery audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSRS_MARKET_USER_AGENT: "osrs-market-data wiki-catalogue-audit - github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Discover and compare Wiki money-making guides
        run: python tools/wiki_catalog_audit.py --output build/wiki-catalogue-audit.json --impact-output build/wiki-catalogue-impact-v3.json
      - name: Upload review reports
        uses: actions/upload-artifact@v6
        with:
          name: wiki-catalogue-audit
          path: |
            build/wiki-catalogue-audit.json
            build/wiki-catalogue-impact-v3.json
          retention-days: 30
