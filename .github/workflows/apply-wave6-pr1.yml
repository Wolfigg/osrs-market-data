name: Apply Wave 6 PR1 integration

on:
  push:
    branches:
      - wave6/player-profile-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[wave6-pr1-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave6/player-profile-foundation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Integrate profile assets and catalogue requirements
        run: |
          python - <<'PY'
          from pathlib import Path

          public = Path("src/osrs_market/public_site.py")
          text = public.read_text(encoding="utf-8")
          replacements = {
              'PUBLIC_ASSET_VERSION = "20260829-4"': 'PUBLIC_ASSET_VERSION = "20260830-1"',
              '"index.html", "alchemy.html", "assets/app.css", "assets/app.js", "assets/enhancements.js",': '"index.html", "alchemy.html", "assets/app.css", "assets/app.js", "assets/enhancements.js", "assets/cooking_math.js", "assets/profile.js",',
              '  <script defer src="assets/enhancements.js?v={version}"></script>': '  <script defer src="assets/enhancements.js?v={version}"></script>\n  <script defer src="assets/cooking_math.js?v={version}"></script>\n  <script defer src="assets/profile.js?v={version}"></script>',
              'for filename in ("app.css", "app.js", "enhancements.js"):': 'for filename in ("app.css", "app.js", "enhancements.js", "cooking_math.js", "profile.js"):',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"public-site integration marker missing: {old}")
              text = text.replace(old, new, 1)
          public.write_text(text, encoding="utf-8")

          catalog = Path("src/osrs_market/catalog_wave5.py")
          text = catalog.read_text(encoding="utf-8")
          old_standard = '"requirements": {"members": True, "magic": level, "construction": construction, "equipment": [lectern]}'
          new_standard = '"requirements": {"members": True, "magic": level, "construction": construction, "poh_features": [lectern]}'
          if old_standard not in text:
              raise SystemExit("standard-tablet requirements marker missing")
          text = text.replace(old_standard, new_standard)
          old_marble = '"requirements": {"members": True, "magic": level, "construction": 77, "equipment": ["Marble lectern"]}'
          new_marble = '"requirements": {"members": True, "magic": level, "construction": 77, "poh_features": ["Marble lectern"]}'
          if old_marble not in text:
              raise SystemExit("marble-tablet requirements marker missing")
          text = text.replace(old_marble, new_marble)
          old_book = '"requirements": {"members": True, "magic": level, "quests": [quest], "equipment": [equipment]}'
          new_book = '"requirements": {"members": True, "magic": level, "quests": [quest], "unlocks": [f"{book}_spellbook"]}'
          if old_book not in text:
              raise SystemExit("ancient/lunar requirements marker missing")
          text = text.replace(old_book, new_book)
          old_arceuus = '"requirements": {"members": True, "magic": level, "mining": 38, "equipment": ["Arceuus lectern"], "supplies": ["Self-supplied dark essence block and spell runes"]}'
          new_arceuus = '"requirements": {"members": True, "magic": level, "mining": 38, "unlocks": ["arceuus_spellbook"], "supplies": ["Self-supplied dark essence block and spell runes"]}'
          if old_arceuus not in text:
              raise SystemExit("Arceuus requirements marker missing")
          text = text.replace(old_arceuus, new_arceuus)
          catalog.write_text(text, encoding="utf-8")

          profile = Path("web/assets/profile.js")
          text = profile.read_text(encoding="utf-8")
          old = 'const success = cookingChance(cooking, profile.skills.cooking, profile.methodSettings?.cooking?.location || "range", gauntlets, cape);'
          new = 'const success = window.OsrsCookingMath.successProbability(cooking, profile.skills.cooking, profile.methodSettings?.cooking?.location || "range", gauntlets, cape);'
          if old not in text:
              raise SystemExit("profile cooking integration marker missing")
          profile.write_text(text.replace(old, new, 1), encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          old = '      - name: Run tests\n        run: pytest\n'
          new = '      - name: Run tests\n        run: pytest\n\n      - name: Run cooking backend/frontend parity\n        run: node tests/cooking_parity.mjs\n'
          if old not in text:
              raise SystemExit("CI test marker missing")
          ci.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run Python tests
        run: pytest -q
      - name: Run cooking parity
        run: node tests/cooking_parity.mjs
      - name: Build deterministic public fixture
        run: python tests/build_browser_fixture.py
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/apply-wave6-pr1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/osrs_market/public_site.py src/osrs_market/catalog_wave5.py web/assets/profile.js .github/workflows/ci.yml .github/workflows/apply-wave6-pr1.yml
          git commit -m "Integrate Wave 6 player profile foundation [wave6-pr1-integrated]"
          git push origin HEAD:wave6/player-profile-foundation
