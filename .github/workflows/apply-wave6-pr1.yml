name: Apply Wave 6 PR1 integration

on:
  push:
    branches:
      - wave6/player-profile-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[wave6-pr1-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave6/player-profile-foundation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Integrate profile assets and catalogue requirements
        run: |
          python - <<'PY'
          from pathlib import Path

          public = Path("src/osrs_market/public_site.py")
          text = public.read_text(encoding="utf-8")
          replacements = {
              'PUBLIC_ASSET_VERSION = "20260829-4"': 'PUBLIC_ASSET_VERSION = "20260830-1"',
              '"index.html", "alchemy.html", "assets/app.css", "assets/app.js", "assets/enhancements.js",': '"index.html", "alchemy.html", "assets/app.css", "assets/app.js", "assets/enhancements.js", "assets/cooking_math.js", "assets/profile.js",',
              '  <script defer src="assets/enhancements.js?v={version}"></script>': '  <script defer src="assets/enhancements.js?v={version}"></script>\n  <script defer src="assets/cooking_math.js?v={version}"></script>\n  <script defer src="assets/profile.js?v={version}"></script>',
              'for filename in ("app.css", "app.js", "enhancements.js"):': 'for filename in ("app.css", "app.js", "enhancements.js", "cooking_math.js", "profile.js"):',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"public-site integration marker missing: {old}")
              text = text.replace(old, new, 1)
          public.write_text(text, encoding="utf-8")

          catalog = Path("src/osrs_market/catalog_wave5.py")
          text = catalog.read_text(encoding="utf-8")
          replacements = {
              '{"members": True, "magic": level, "construction": construction, "equipment": [lectern]}': '{"members": True, "magic": level, "construction": construction, "poh_features": [lectern]}',
              '{"members": True, "magic": level, "construction": 77, "equipment": ["Marble lectern"]}': '{"members": True, "magic": level, "construction": 77, "poh_features": ["Marble lectern"]}',
              '{"members": True, "magic": level, "quests": [quest], "equipment": [equipment]}': '{"members": True, "magic": level, "quests": [quest], "unlocks": [f"{book}_spellbook"]}',
              '{"members": True, "magic": level, "mining": 38, "equipment": ["Arceuus lectern"], "supplies": ["Self-supplied dark essence block and spell runes"]}': '{"members": True, "magic": level, "mining": 38, "unlocks": ["arceuus_spellbook"], "supplies": ["Self-supplied dark essence block and spell runes"]}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"catalogue integration marker missing: {old}")
              text = text.replace(old, new)
          catalog.write_text(text, encoding="utf-8")

          profile = Path("web/assets/profile.js")
          text = profile.read_text(encoding="utf-8")
          old = 'const success = cookingChance(cooking, profile.skills.cooking, profile.methodSettings?.cooking?.location || "range", gauntlets, cape);'
          new = 'const success = window.OsrsCookingMath.successProbability(cooking, profile.skills.cooking, profile.methodSettings?.cooking?.location || "range", gauntlets, cape);'
          if old not in text:
              raise SystemExit("profile cooking integration marker missing")
          text = text.replace(old, new, 1)
          text = text.replace('Number(raw?.price || 0)', 'Number(raw?.gePrice ?? raw?.price ?? 0)')
          profile.write_text(text, encoding="utf-8")

          personalisation = Path("src/osrs_market/personalisation.py")
          text = personalisation.read_text(encoding="utf-8")
          text = text.replace('generic = _apply_profile_settings(method, PlayerProfile()) if False else deepcopy(method)', 'generic = deepcopy(method)')
          personalisation.write_text(text, encoding="utf-8")

          tests = Path("tests/test_public_site.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace('(assets / "enhancements.js").write_text("void 0;", encoding="utf-8")', '(assets / "enhancements.js").write_text("void 0;", encoding="utf-8")\n    (assets / "cooking_math.js").write_text("void 0;", encoding="utf-8")\n    (assets / "profile.js").write_text("void 0;", encoding="utf-8")')
          text = text.replace('for name in ("app.css", "app.js", "enhancements.js"):', 'for name in ("app.css", "app.js", "enhancements.js", "cooking_math.js", "profile.js"):')
          text = text.replace('for asset in ("app.css", "app.js", "enhancements.js"):', 'for asset in ("app.css", "app.js", "enhancements.js", "cooking_math.js", "profile.js"):')
          tests.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          marker = '      - name: Install Playwright browsers\n'
          insertion = '      - name: Run cooking backend/frontend parity\n        run: node tests/cooking_parity.mjs\n\n'
          if marker not in text:
              raise SystemExit("CI Node integration marker missing")
          text = text.replace(marker, insertion + marker, 1)
          ci.write_text(text, encoding="utf-8")
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run Python tests
        run: pytest -q
      - name: Run cooking parity
        run: node tests/cooking_parity.mjs
      - name: Build deterministic public fixture
        run: python tests/build_browser_fixture.py
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/apply-wave6-pr1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/osrs_market/public_site.py src/osrs_market/catalog_wave5.py src/osrs_market/personalisation.py web/assets/profile.js tests/test_public_site.py .github/workflows/ci.yml .github/workflows/apply-wave6-pr1.yml
          git commit -m "Integrate Wave 6 player profile foundation [wave6-pr1-integrated]"
          git push origin HEAD:wave6/player-profile-foundation
