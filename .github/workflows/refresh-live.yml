name: Refresh live market data

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "2/5 * * * *"

concurrency:
  group: osrs-market-publish
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSRS_MARKET_USER_AGENT: "osrs-market-data/0.3 - github.com/${{ github.repository }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore derived market cache
        uses: actions/cache/restore@v4
        with:
          path: .market-cache
          key: osrs-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            osrs-history-${{ runner.os }}-${{ github.ref_name }}-

      - name: Refresh live mapping
        # The item mapping is cheap metadata and may change independently of the
        # historical cache. Never let an old mapping prevent a live deployment.
        run: rm -f .market-cache/mapping.json

      - name: Refresh live prices and rebuild public site
        run: /usr/bin/time -v python -m osrs_market.cli collect --mode live --output build --cache-dir .market-cache

      - name: Install Session Planner V3 browser module
        run: |
          cp web/assets/planner_v3.js build/public-site/assets/planner_v3.js
          python - <<'PY'
          from pathlib import Path
          path = Path('build/public-site/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</head>'
          script = '  <script defer src="assets/planner_v3.js?v=20260830-2"></script>\n'
          if 'assets/planner_v3.js' not in text:
              text = text.replace(marker, script + marker)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload maintainer diagnostics
        if: always() && hashFiles('build/internal-report/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: osrs-market-live-diagnostics
          path: build/internal-report
          retention-days: 3
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload public GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
