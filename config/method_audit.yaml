methods:
  steel_cannonballs_double_mould:
    status: verified
    verified_at: 2026-08-29
    method_types: [bankstanding, make-x]
    source: https://oldschool.runescape.wiki/w/Pay-to-play_Smithing_training
    checks:
      cycles_per_hour: 1080
      theoretical_cycles_per_hour: 1200
      afk_interval_seconds: 80
      input_units_per_cycle: 1
      output_units_per_cycle: 4
    notes: Cycle basis is one steel bar. The double ammo mould physically processes two bars into eight cannonballs per action, which is economically equivalent to one configured cycle producing four cannonballs. The configured 4,320 cannonballs/hour is conservative against the Wiki's 4,800/hour table rate.

  sapphire_bolt_tips:
    status: verified
    verified_at: 2026-08-29
    method_types: [bankstanding, make-x]
    source: https://oldschool.runescape.wiki/w/Sapphire_bolt_tips
    checks:
      cycles_per_hour: 1150
      theoretical_cycles_per_hour: 1200
      afk_interval_seconds: 81
      input_units_per_cycle: 1
      output_units_per_cycle: 12
    notes: One sapphire becomes 12 tips at level 56 Fletching. Creation takes 3 seconds per gem; 27-gem inventories give about 81 seconds of uninterrupted processing.

  emerald_bolt_tips:
