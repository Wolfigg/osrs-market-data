  mahogany_plank_make_afk:
    status: verified
    verified_at: "2026-11-25"
    method_types: [bankstanding, autocast]
    source: https://oldschool.runescape.wiki/w/Plank_Make
    checks:
      cycles_per_hour: 833
      theoretical_cycles_per_hour: 1000
      afk_interval_seconds: 90
      input_units_per_cycle: 4
      output_units_per_cycle: 1
      fixed_cost_gp_per_cycle: 1050
    notes: Level 86 Magic and Dream Mentor. Each cast uses one log, one Nature rune, two Astral runes and 15 Earth runes; an Earth-supplying staff makes Earth runes reusable equipment rather than consumed capital. Plank Make charges 70% of the sawmill fee, 1,050 coins for mahogany. The working rate is 75,000 XP/hour divided by 90 XP/cast, about 833 planks/hour; the theoretical rate is 90,000 XP/hour, or 1,000 casts/hour. Autocasting repeats every 3.6 seconds, so a 26-log inventory takes about 94 seconds.

