  mahogany_plank_make_afk:
    status: verified
    verified_at: 2026-08-29
    method_types: [bankstanding, autocast]
    source: https://oldschool.runescape.wiki/w/Plank_Make
    checks:
      cycles_per_hour: 833
      theoretical_cycles_per_hour: 1000
      afk_interval_seconds: 90
      input_units_per_cycle: 4
      output_units_per_cycle: 1
      fixed_cost_gp_per_cycle: 1050
    notes: Level 86 Magic and Dream Mentor. Each cast uses one log, one Nature rune, two Astral runes and 15 Earth runes; an Earth-supplying staff makes Earth runes reusable equipment rather than consumed capital. Plank Make charges 1,050 coins for mahogany. The 833/hour rate is the conservative 75k XP/hour AFK rate divided by 90 XP/cast.

  camphor_plank_make_afk:
