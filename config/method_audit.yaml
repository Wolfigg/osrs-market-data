    checks:
      cycles_per_hour: 360
      theoretical_cycles_per_hour: 360
      afk_interval_seconds: 10
      input_units_per_cycle: 28
      output_units_per_cycle: 26
    notes: One cast recharges up to 26 eligible items in the inventory to four charges. The 360 casts/hour working rate is calculated from the Pay-to-play Magic training page's 35,100 Magic XP/hour divided by 97.5 XP per cast; it is an average 10-second batch cadence, not an unattended AFK window. A water-rune staff supplies the four Water runes; one Astral and one Soul rune are consumed per cast.

