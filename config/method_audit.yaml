    notes: Same autocast mechanics as mahogany. Each cast uses one Nature rune, two Astral runes and 15 Earth runes; the assumed Earth-rune staff supplies the Earth runes. Plank Make charges 1,750 coins per Camphor log. The method uses the same 833/hour working and 1,000/hour theoretical rates as the other plank tiers.

