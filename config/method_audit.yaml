recharge_dragonstone_amulet_glory:
    status: verified
    verified_at: "2026-11-25"
    method_types: [bankstanding]
    source: https://oldschool.runescape.wiki/w/Pay-to-play_Magic_training
    checks:
      cycles_per_hour: 360
      theoretical_cycles_per_hour: 360
      afk_interval_seconds: 10
      input_units_per_cycle: 28
      output_units_per_cycle: 26
    notes: One cast recharges up to 26 eligible items in the inventory to four charges. The 360 casts/hour rate is derived from the Wiki's 35,100 Magic XP/hour divided by 97.5 XP per cast; no higher bank-processing rate is assumed. A water-rune staff supplies the four Water runes; one Astral and one Soul rune are consumed per cast.

