      afk_interval_seconds: 90
      input_units_per_cycle: 4
      output_units_per_cycle: 1
      fixed_cost_gp_per_cycle: 1750
    notes: Same autocast mechanics as mahogany. Current Wiki spell data lists 1,750 coins per Camphor log, one Nature rune, two Astral runes and 15 Earth runes. Earth runes are supplied by the assumed staff.

  bronze_dart_tips:
