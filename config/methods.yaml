        quantity: 2
        buy_via_ge: true
    outputs:
      - item_id: 8782
        quantity: 1
    fixed_cost_gp_per_cycle: 1050
    cycles_per_hour: 833
    theoretical_cycles_per_hour: 1000
    planned_hours_per_day: 4
    afk:
      interval_seconds: 90
      intensity: very_low
      description: Cast once per inventory and let Plank Make auto-cast. Wiki guidance describes roughly 90 seconds per inventory with minimal attention.
    requirements:
      members: true
      magic: 86
      quests:
        - Dream Mentor
      equipment:
        - Earth-rune supplying staff
    notes: Realistic AFK rate uses about 75,000 Magic XP/hour divided by 90 XP/cast, approximately 833 planks/hour. Earth rune cost is excluded because an earth-providing staff is assumed.
    reference: https://oldschool.runescape.wiki/w/Plank_Make

