methods:
  steel_cannonballs_double_mould:
    enabled: true
    name: Steel cannonballs - double ammo mould
    category: smithing
    inputs:
      - item_id: 2353
        quantity: 1
        buy_via_ge: true
    outputs:
      - item_id: 2
        quantity: 4
    fixed_cost_gp_per_cycle: 0
    cycles_per_hour: 1080
    theoretical_cycles_per_hour: 1200
    planned_hours_per_day: 4
    afk:
      interval_seconds: 80
      intensity: very_low
      description: A full inventory with the double ammo mould takes roughly half of the normal 160-second Make-X duration; banking interrupts the idle window.
    requirements:
      members: true
      smithing: 35
      quests:
        - Dwarf Cannon
        - Sleeping Giants
      equipment:
        - Double ammo mould
    notes: Uses the conservative Edgeville-style rate of about 4,320 steel cannonballs/hour. Theoretical wiki training tables commonly use 4,800/hour with efficient banking.
    reference: https://oldschool.runescape.wiki/w/Pay-to-play_Smithing_training

